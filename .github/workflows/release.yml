name: Release

on:
  push:
    branches: [main]

# semantic-release pushes the version-bump commit + tag, creates the GitHub
# release, and comments on related issues/PRs. `id-token: write` lets npm
# authenticate to the registry via OIDC Trusted Publishing (no NPM_TOKEN).
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # semantic-release needs the full history and tags to compute the bump.
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          # Node 24 (latest LTS) ships npm 11.x, which supports OIDC publishing.
          node-version: 24
          cache: npm
      - run: npm ci
      # Gate the release on the same checks CI runs.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format
      - run: npm test
      - run: npm run build
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
